name: Flutter iOS Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  flutter-tests:
    name: Flutter Unit & Widget Tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

  ios-simulator-check:
    name: iOS Simulator Build (No Codesign)
    runs-on: macos-latest
    needs: flutter-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS app for simulator
        run: flutter build ios --debug --simulator

      - name: Run integration_test suite (if present)
        run: |
          if [ -d integration_test ] && find integration_test -type f -name '*_test.dart' | grep -q .; then
            flutter test integration_test
          else
            echo "No integration_test files found; skipping integration_test step."
          fi
